# Educación
# ============================================================================
#
# Un bloque `[[education]]` por título. Copiá el bloque las veces que haga
# falta. Si no estudiaste formalmente, borrá los bloques.
#
# `degree` sale de la lista del apéndice, verbatim.

[[education]]
degree = ""
institution = ""
start = ""
end = ""

[[education]]
degree = ""
institution = ""
start = ""
