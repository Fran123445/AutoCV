# Mi experiencia
#
# Este archivo es la fuente de verdad del lado candidato: de acá salen
# `FactExperience`, `Project`, sus bridges y los rollups de skills. Es lo único
# del pipeline que ninguna re-corrida puede regenerar, así que guardalo fuera de
# `data/` y respaldalo.
#
# Cómo llenarlo. Copiá este archivo a la raíz del repo como `experience.toml`
# (o apuntá `AUTOCV_EXPERIENCE_PATH` a donde lo tengas) y editalo.
#
# Los campos se leen literal, la prosa la lee el modelo. Por eso los campos
# tienen formato estricto y la prosa no tiene ninguno: escribí como hablás, en
# el idioma que quieras, sin bullets prolijos ni tercera persona. Canonicalizar
# contra las dims y arreglar la voz es trabajo del transform, no tuyo.
#
# Vacío es válido. Un campo que no sabés o no aplica se deja en `""`, o se
# borra la línea entera: las dos formas entran como null. No inventes para
# llenar el hueco.
#
# La prosa va entre `'''`, que en TOML es texto literal: adentro no se escapa
# nada y no importa la indentación. Escribí a partir del margen izquierdo y
# usá los renglones que quieras.
#
# Fechas: string `"YYYY-MM-DD"`, o `"YYYY-MM"` si no te acordás el día (es lo
# normal). Van como string y no como fecha de TOML justamente para que
# `"YYYY-MM"` sea legal. Un `end` vacío o `"current"` significa que sigue.


# ============================================================================
# Perfil
# ============================================================================
#
# Esto no se matchea contra nada: es lo que va impreso en el encabezado del CV.
# Por eso no hay listas cerradas ni canonicalización acá — sale tal cual lo
# escribas.
#
# `location` es ciudad y país como los pondrías en el CV, no dirección postal.
# `birth_date` en ISO 8601 (`YYYY-MM-DD`), y sólo porque `FactUser` lo tiene:
# si no lo querés en la base, dejalo vacío.

[profile]
full_name = ""
email = ""
phone = ""
location = ""
birth_date = ""

# Un bloque `[[profile.link]]` por link. `kind` es libre (`github`, `linkedin`,
# `portfolio`, `blog`, lo que sea) y es la clave: uno solo por tipo. El orden en
# que los escribas es el orden en que salen en el CV, así que no hay ningún
# campo de posición que llenar. Si no tenés links, borrá los bloques.

[[profile.link]]
kind = ""
url = ""

[[profile.link]]
kind = ""
url = ""


