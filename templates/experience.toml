# ============================================================================
# Experiencia
# ============================================================================
#
# Un bloque `[[job]]` por puesto. Copiá el bloque las veces que haga falta, del
# más reciente al más viejo. Un cambio de rol o de seniority dentro de la misma
# empresa es un bloque nuevo: la base modela el puesto, no el empleador.
#
# `id` es la clave de dedupe, no un título: de él sale el `source_path` de los
# proyectos del puesto, que es lo que evita que una segunda corrida los
# duplique. Slug corto y estable (`lenovo-data-intern`). Cambiarlo después de
# una carga crea filas nuevas en vez de actualizar las viejas.
#
# `role` y `seniority` salen verbatim de las listas del apéndice. Si ninguna
# opción encaja, escribí la tuya igual: el transform la marca como `unmatched`
# en vez de forzarla, y eso es una señal útil de que a los seeds les falta algo.

[[job]]
id = ""
company = ""
role = ""
seniority = ""
start = ""
end = ""

# Qué hacías realmente, no lo que decía el contrato. Tres o cuatro oraciones
# alcanzan. Sirve nombrar:
#
#   - de qué eras dueño de punta a punta
#   - con qué stack, y qué parte del stack tocabas vos
#   - con quién trabajabas (equipo, tamaño, si liderabas a alguien)
#   - qué tipo de problema aparecía una y otra vez
#
# Escribí las tecnologías con el nombre que usás al hablar. `postgres`,
# `postgre` y `PostgreSQL` resuelven todas a lo mismo; los alias están en los
# seeds.
day_to_day = '''
'''

# Acá está el 80% del valor del archivo. Un proyecto es una iniciativa concreta
# con principio y fin, no una responsabilidad continua: "migré el reporting de
# Excel a un warehouse" es un proyecto, "mantenía los reportes" es día a día.
#
# Dos o tres por trabajo, los que mejor te representen. Uno contado en detalle
# pesa más que cinco enumerados.
#
# Un bloque `[[job.project]]` por proyecto, siempre después del `day_to_day`
# del puesto al que pertenece. Igual que en el puesto, `id` es clave de dedupe:
# slug corto, estable, único dentro del trabajo.
#
# `story` contesta estas cuatro. En prosa corrida, no como formulario: son la
# guía de lo que no hay que dejarse afuera, no campos.
#
#   1. ¿Qué problema resolvía? Qué estaba roto, lento, manual o ausente antes.
#   2. ¿Qué construiste vos, específicamente? La parte tuya, no la del equipo.
#      Si el proyecto era de diez personas, decí cuál de las diez partes era
#      tuya.
#   3. ¿Con qué? Lenguajes, frameworks, bases, servicios, herramientas. Nombrá
#      también las decisiones: por qué esa base y no otra, si es que decidiste
#      vos.
#   4. ¿En qué terminó? Números si los tenés (cuánto más rápido, cuántos
#      usuarios, cuánto ahorró). Si no los tenés, decilo cualitativo — un
#      número inventado es peor que ninguno, y en una entrevista se cae solo.

[[job.project]]
id = ""
story = '''
'''

[[job.project]]
id = ""
story = '''
'''


[[job]]
id = ""
company = ""
role = ""
seniority = ""
start = ""
end = ""
day_to_day = '''
'''

[[job.project]]
id = ""
story = '''
'''


